<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form method="post">
      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required="true"
        placeholder="Name"
      />
      <br />
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        required="true"
        placeholder="Email"
      />
      <br />
      <label for="gender">Gender</label>
      <input type="radio"  name="gender" required="true" />
      <label for="gender">Male</label>
      <input type="radio"  name="gender" required="true" />
      <label for="gender">Female</label>
      <br />
      <label for="cars">car brands</label>
      <select
        id="cars"
        name="cars"
        required="false"
        placeholder="--Please choose an option--"
      >
        <option value="BMW">Volvo</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
      </select>
      <br />
      <label for="carage">age</label>
      <input
        type="number"
        id="carage"
        name="carage"
        required="true"
        placeholder="Age"
      />
      <br />
      <label for="dop">Date of Purchase (dop)</label>
      <input type="date" id="dop" name="dop" required="true" />
      <br />
      
      <label for="password">password</label>
      <input
        type="password"
        id="password"
        name="password"
        required="true"
        placeholder="Password"
      />
      <br />
      <button type="submit">Submit</button>
    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
